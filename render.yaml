services:
  - type: web
    name: credilens-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python start_server.py
    healthCheckPath: /health
    envVars:
      - key: CREDILENS_API_KEYS
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
